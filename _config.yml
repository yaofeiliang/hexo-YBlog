# hexo-tag-aplayer
# reference: https://github.com/MoePlayer/hexo-tag-aplayer
# aplayer:
#   meting: true

# MeingJS support for Aplayer
# reference: https://github.com/metowolf/MetingJS & https://github.com/MoePlayer/APlayer
metingjs: false
data-id: 2423410161
data-server: netease
data-type: playlist
data-fixed: true
  # data-mini:
  # data-autoplay:

## Themes: https://hexo.io/themes/
theme: yaofeiliang

#sitemap
sitemap:
  path: sitemap.xml

# RSS feed
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: false
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date

# Deployment
## Docs: https://hexo.io/docs/deployment.html
deploy:
  type: git
  repository: https://github.com/yaofeiliang/hexo-YBlog
  branch: gh-pages
  message: Update CNAME

